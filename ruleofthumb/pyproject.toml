[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruleofthumb"
version = "0.2.2"
description = "Rule of Thumb: explaining AI systems using partial information"
readme = "README.md"
license = "MIT"
authors = [{ name = "RoT authors" }]
requires-python = ">=3.9"
keywords = ["explainability", "interpretability", "machine-learning", "rule-of-thumb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
    "torchvision>=0.14",
    "transformers>=4.30",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "wordcloud>=1.9",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ruleofthumb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
